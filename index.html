<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>porotos list</title>
  <meta name="description" content="la lista de demons de nuestro gdps">
  <script>try { if (localStorage.getItem('porotos-theme') === 'night') document.documentElement.dataset.theme = 'night'; } catch {}</script>
  <link rel="stylesheet" href="css/aero.css">
</head>
<body>
  <main class="aero-window">
    <header class="titlebar">
      <span id="logoSlot"></span>
      <h1 id="siteTitle">porotos list</h1>
    </header>

    <div class="pane">
      <nav class="sidebar" aria-label="secciones">
        <div class="nav-group">
          <div class="nav-title">lista</div>
          <a class="nav-btn" href="#/" data-nav="list"><i data-icon="cube"></i>niveles</a>
          <a class="nav-btn" href="#/leaderboard" data-nav="leaderboard"><i data-icon="trophy"></i>leaderboard</a>
        </div>
        <div class="nav-group">
          <div class="nav-title">más</div>
          <a class="nav-btn" href="#/novedades" data-nav="novedades"><i data-icon="star"></i>novedades</a>
          <a class="nav-btn" href="#/info" data-nav="info"><i data-icon="info"></i>info</a>
        </div>
        <button class="nav-btn theme-btn" id="themeToggle" type="button"></button>
      </nav>

      <section class="content" id="view" aria-live="polite"></section>

      <footer class="statusbar" id="status"><span>cargando…</span></footer>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
